<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GitHub Timelines — Electron</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
  <header>
    <div class="left">
      <h1>GitHub Timelines — csndl-iitd</h1>
      <div class="controls">
        <div id="auth-section">
          <button id="oauthButton">Sign in with GitHub (device)</button>
          <!-- <button id="patButton">Paste PAT</button> -->
        </div>
        <label><input type="checkbox" id="showClosed" checked> Show closed</label>
        <label><input type="checkbox" id="showNotPlanned" checked> Show Not Planned</label>
        <label>Theme: <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      </div>
    </div>
    <div id="status">
      <span id="statusText">Not authenticated</span>
      <span id="statusActions" style="margin-left:12px;"></span>
    </div>
  </header>
  <main id="content">
    <div class="intro">Click sign-in or paste a PAT.</div>
  </main>
  <script defer src="renderer.js"></script>
</body>
</html>
